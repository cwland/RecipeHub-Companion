<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RecipeHub Companion</title>
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="../../assets/icons/icon-32.png" alt="" width="24" height="24" />
      <strong>RecipeHub Companion</strong>
    </header>

    <p id="status" class="status" data-state="checking" role="status">Checking RecipeHub…</p>

    <section class="card" aria-label="This page">
      <div class="page">
        <img id="page-icon" alt="" width="20" height="20" hidden />
        <div class="page-text">
          <p id="page-title" class="page-title">…</p>
          <p class="muted"><span id="page-site"></span> <span id="page-kind"></span></p>
        </div>
      </div>
      <button id="send" class="primary" type="button" disabled>Send to Inbox</button>
      <div class="import">
        <button id="import" class="secondary" type="button" disabled>Import to RecipeHub</button>
        <label class="check"><input id="improve" type="checkbox" disabled /> Run through AI correction</label>
        <p id="import-hint" class="muted"></p>
      </div>
    </section>

    <section class="card switches" aria-label="Floating button">
      <label class="switch">
        <input id="bubble" type="checkbox" role="switch" disabled />
        <span>
          <b>Floating button on this page</b>
          <span class="muted">Send or import from the page itself. Only on this page, until you leave it.</span>
        </span>
      </label>
      <label class="switch">
        <input id="always" type="checkbox" role="switch" disabled />
        <span>
          <b>Always show on this site</b>
          <span class="muted">The button appears by itself on every page of <span id="always-site"></span>. The browser asks once to let the extension read it.</span>
        </span>
      </label>
    </section>


    <p id="result" class="result" role="status" aria-live="polite"></p>

    <footer class="links">
      <button id="open-inbox" class="link" type="button">Open inbox</button>
      <button id="settings" class="link" type="button">Settings</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
